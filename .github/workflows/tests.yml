name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres for local dev, MySQL for the Forge server.
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: pgsql
            port: 5432
            user: postgres
          - db: mysql
            port: 3306
            user: root

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pxi_forge_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: postgres
          MYSQL_DATABASE: pxi_forge_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ppostgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Job env beats .env and phpunit.xml, so setup and tests share one DB.
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.user }}
      DB_PASSWORD: postgres
      DB_DATABASE: pxi_forge_testing

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
